<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Loris</title>
  <style>
    :root {
      color-scheme: light dark;
      --orange: #ff6b00;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --bg: #fff7f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f5f5f5;
        --muted: #a8a8a8;
        --bg: #1a120c;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      background: radial-gradient(circle at top, #ffd7b8 0%, var(--bg) 55%);
      color: var(--text);
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 48px;
      text-align: center;
    }
    .mark {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: var(--orange);
      margin-bottom: 20px;
      box-shadow: 0 12px 30px rgba(255, 107, 0, 0.28);
      position: relative;
    }
    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      background: #1a1a1a;
      border-radius: 50%;
    }
    .mark::before {
      width: 12px;
      height: 12px;
      top: 30px;
      left: 26px;
      box-shadow: 24px 0 0 #1a1a1a;
    }
    .mark::after {
      width: 28px;
      height: 10px;
      top: 52px;
      left: 30px;
      border-radius: 0 0 28px 28px;
      background: transparent;
      border: 3px solid #1a1a1a;
      border-top: none;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.4;
      max-width: 18rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Loris</h1>
    <p>Type a search or website in the address bar to start browsing.</p>
  </main>
</body>
</html>
